name: Groww data

on:
  push:
    branches: [main]
    paths: ["scripts/fetch_groww.py", ".github/workflows/groww.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q growwapi pyotp
      - name: Fetch from Groww
        env:
          GROWW_API_KEY: ${{ secrets.GROWW_API_KEY }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
        run: python scripts/fetch_groww.py test
      - name: Commit
        if: always()
        run: |
          git config user.name "market-tasks-bot"
          git config user.email "market-tasks-bot@users.noreply.github.com"
          git add -A data/groww
          git diff --cached --quiet && exit 0
          git commit -m "Groww data $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
